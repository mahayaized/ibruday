<title>for ibru ♡</title>
<style>
:root { color-scheme: dark; --orange: #ff5500; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: #080808; color: var(--orange);
  font-family: "Courier New", Courier, monospace; display: flex;
  justify-content: center; align-items: center; padding: 22px;
}
.terminal {
  width: min(760px, 100%); min-height: 440px; border: 1px solid #6e2609;
  background: #050505; padding: clamp(18px, 4vw, 32px);
  box-shadow: 0 0 28px #ff550018, inset 0 0 30px #ff550008;
}
.top { color: #a83b0b; font-size: 12px; margin-bottom: 28px; }
h1 { font-size: clamp(22px, 5vw, 30px); font-weight: normal; margin: 0 0 12px; text-shadow: 0 0 9px #ff550066; }
p { line-height: 1.65; }
.sub { color: #d14a0c; }
.output { min-height: 94px; margin-top: 24px; line-height: 1.7; overflow-wrap: anywhere; }
.reason { color: #ff7a36; text-shadow: 0 0 7px #ff550033; }
.promptrow { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.prompt { white-space: nowrap; }
input {
  min-width: 0; flex: 1; background: transparent; color: var(--orange);
  border: 0; border-bottom: 1px solid #9d390b; outline: none; padding: 10px 2px;
  font: inherit; font-size: 16px; border-radius: 0;
}
input:focus { border-bottom-color: var(--orange); box-shadow: 0 1px 0 #ff550044; }
button {
  background: transparent; color: var(--orange); border: 1px solid #9d390b;
  padding: 9px 13px; font: inherit; cursor: pointer;
}
button:hover, button:focus { background: #ff550015; border-color: var(--orange); }
.footer { color: #7f300e; font-size: 12px; margin-top: 26px; }
::selection { background: var(--orange); color: #080808; }
@media (max-width: 480px) {
  body { padding: 12px; align-items: flex-start; padding-top: 7vh; }
  .terminal { min-height: 0; padding: 18px; }
  .promptrow { align-items: stretch; flex-wrap: wrap; }
  .prompt { padding-top: 10px; }
  button { width: 100%; }
}
</style>
</head>

    <label class="prompt" for="number">type here silly!!</label>
    <input id="number" name="number" inputmode="numeric" aria-label="Reason number" placeholder="enter a number..." autofocus>
    <button type="submit">reveal</button>

const form = document.getElementById('reason-form');
const input = document.getElementById('number');
const output = document.getElementById('output');
form.addEventListener('submit', (event) => {
  event.preventDefault();
  const raw = input.value.trim();
  if (!/^\d+$/.test(raw) || Number(raw) < 1 || Number(raw) > 100) {
    output.textContent = 'please enter a number between 1 and 100.';
    output.className = 'output';
    return;
  }
  const n = Number(raw);

});
